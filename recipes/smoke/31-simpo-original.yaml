run_label: simpo-original-smoke-s42
stage: simpo
parent: M2-SFT
seed: 42

data:
  target_pairs: 200
  pair_policy: verified_length_controlled_v1
  evaluation_pairs: 50

# Original SimPO: cpo_alpha MUST be 0.0. ms-swift defaults cpo_alpha to 1.0,
# which mixes a CPO/SFT NLL term and is not the original SimPO objective.
training:
  tuner_type: lora
  torch_dtype: float16
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 8
  learning_rate: 0.0001
  lora_rank: 8
  lora_alpha: 32
  target_modules: all-linear
  gradient_checkpointing: true
  max_length: 1024
  max_steps: 20
  warmup_ratio: 0.05
  weight_decay: 0.0
  max_grad_norm: 1.0
  logging_steps: 1
  save_steps: 10
  save_total_limit: 2
  split_dataset_ratio: 0
  dataset_num_proc: 1
  dataloader_num_workers: 0
  use_hf: true
  beta: 2.0
  simpo_gamma: 1.0
  cpo_alpha: 0.0
